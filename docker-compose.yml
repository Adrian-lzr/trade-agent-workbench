services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${TRADE_POSTGRES_DB:-trade_agent}
      POSTGRES_USER: ${TRADE_POSTGRES_USER:-trade_agent}
      POSTGRES_PASSWORD: ${TRADE_POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - trade_agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    profiles:
      - app
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uv", "run", "uvicorn", "trade_agent.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://${TRADE_POSTGRES_USER:-trade_agent}:${TRADE_POSTGRES_PASSWORD:-local-dev-only}@postgres:5432/${TRADE_POSTGRES_DB:-trade_agent}
      TRADE_ANALYTICS_MODE: ${TRADE_ANALYTICS_MODE:-fake}
      TRADE_ANALYTICS_DATABASE_URL: postgresql+psycopg://${TRADE_ANALYTICS_USER:-trade_agent_analytics}:${TRADE_ANALYTICS_PASSWORD:-local-dev-only}@postgres:5432/${TRADE_POSTGRES_DB:-trade_agent}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TRADE_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    profiles:
      - app
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uv", "run", "python", "-m", "trade_agent.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${TRADE_POSTGRES_USER:-trade_agent}:${TRADE_POSTGRES_PASSWORD:-local-dev-only}@postgres:5432/${TRADE_POSTGRES_DB:-trade_agent}
      TRADE_WORKER_MODE: ${TRADE_WORKER_MODE:-recovery}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - python
        - -m
        - trade_agent.worker
        - --health
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    profiles:
      - app
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_MODE: ${VITE_API_MODE:-demo}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TRADE_FRONTEND_PORT:-5173}:80"
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://127.0.0.1/
      interval: 10s
      timeout: 5s
      retries: 12

  postgres-test:
    profiles:
      - integration
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${TRADE_TEST_POSTGRES_DB:-trade_agent_test}
      POSTGRES_USER: ${TRADE_POSTGRES_USER:-trade_agent}
      POSTGRES_PASSWORD: ${TRADE_POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:${TRADE_TEST_POSTGRES_PORT:-5433}:5432"
    volumes:
      - trade_agent_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  trade_agent_pgdata:
  trade_agent_test_pgdata:
